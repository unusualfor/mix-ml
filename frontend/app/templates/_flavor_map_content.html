<!-- Out-of-band swap for tabs -->
<div hx-swap-oob="innerHTML:#tabs-container">
  {% include "_inventory_tabs.html" %}
</div>

<!-- Out-of-band swap for subnav -->
<div hx-swap-oob="innerHTML:#flavor-map-subnav">
  <!-- Sub-navigation: Heatmap vs 2D Map -->
  <div class="flex gap-2 mb-6 border-b border-slate-200 pb-4">
    <button id="btn-2dmap"
            onclick="showView('2dmap')"
            class="px-4 py-2 text-sm font-medium rounded-md bg-slate-900 text-white transition-colors">
      2D Map
    </button>
    <button id="btn-heatmap"
            onclick="showView('heatmap')"
            class="px-4 py-2 text-sm font-medium rounded-md bg-white text-slate-600 border border-slate-300 hover:bg-slate-100 transition-colors">
      Heatmap
    </button>
  </div>
</div>

<!-- 2D Map view (default) -->
<div id="view-2dmap">
  {% include "_flavor_map_2d.html" %}
</div>

<!-- Heatmap view -->
<div id="view-heatmap" style="display:none;">
  {% include "_flavor_map_heatmap.html" %}
</div>

<script>
// Dynamically load Plotly.js if not already present (needed for HTMX partial navigation)
if (typeof Plotly === 'undefined') {
  var s = document.createElement('script');
  s.src = 'https://cdn.plot.ly/plotly-2.27.0.min.js';
  s.onload = function() {
    if (typeof initFlavorMap2D === 'function') initFlavorMap2D();
  };
  document.head.appendChild(s);
} else {
  if (typeof initFlavorMap2D === 'function') initFlavorMap2D();
}

// View toggle: Heatmap ↔ 2D Map
function showView(view) {
  document.getElementById('view-heatmap').style.display = view === 'heatmap' ? 'block' : 'none';
  document.getElementById('view-2dmap').style.display = view === '2dmap' ? 'block' : 'none';
  
  if (view === '2dmap' && typeof initFlavorMap2D === 'function') {
    if (typeof Plotly !== 'undefined') {
      initFlavorMap2D();
    } else {
      var check = setInterval(function() {
        if (typeof Plotly !== 'undefined') { clearInterval(check); initFlavorMap2D(); }
      }, 100);
    }
  }

  const btnHeatmap = document.getElementById('btn-heatmap');
  const btn2dmap = document.getElementById('btn-2dmap');
  
  if (view === 'heatmap') {
    btnHeatmap.className = 'px-4 py-2 text-sm font-medium rounded-md bg-slate-900 text-white transition-colors';
    btn2dmap.className = 'px-4 py-2 text-sm font-medium rounded-md bg-white text-slate-600 border border-slate-300 hover:bg-slate-100 transition-colors';
  } else {
    btnHeatmap.className = 'px-4 py-2 text-sm font-medium rounded-md bg-white text-slate-600 border border-slate-300 hover:bg-slate-100 transition-colors';
    btn2dmap.className = 'px-4 py-2 text-sm font-medium rounded-md bg-slate-900 text-white transition-colors';
  }
}
</script>
