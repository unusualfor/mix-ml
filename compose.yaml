services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: cocktailuser
      POSTGRES_PASSWORD: cocktail
      POSTGRES_DB: cocktails
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cocktailuser -d cocktails"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mix-internal

  backend:
    image: ghcr.io/unusualfor/mix-ml-backend:v1.3.2
    container_name: mix-ml-backend
    environment:
      DATABASE_URL: "postgresql+psycopg://cocktailuser:cocktail@postgres:5432/cocktails"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mix-internal
      - caddy

  frontend:
    image: ghcr.io/unusualfor/mix-ml-frontend:v1.3.13
    container_name: mix-ml-frontend
    environment:
      BACKEND_URL: "http://backend:8080"
    volumes:
      # Bind-mount impressions so curated text changes don't require a
      # frontend image rebuild — just `docker compose restart frontend`.
      # Read-write so scripts/regen-flavor-map.sh and add-bottle.sh can
      # `docker exec` the in-container calibrate tool and write directly
      # back to the host file.
      - ./frontend/app/data/cluster_impressions.json:/opt/app-root/src/app/data/cluster_impressions.json:Z
    depends_on:
      - backend
    networks:
      - mix-internal
      - caddy

networks:
  mix-internal:
    driver: bridge
  caddy:
    external: true

volumes:
  pgdata: