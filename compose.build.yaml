# Override for local builds (instead of pulling from ghcr.io)
# Usage: docker compose -f compose.yaml -f compose.build.yaml up -d --build

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
